[pytest]
DJANGO_SETTINGS_MODULE = bookstore.settings_test
python_files = test_*.py
testpaths = tests
addopts = -p no:flask -ra --strict-markers --cov --cov-report=term-missing:skip-covered
markers =
    unit: ізольовані тести моделей, форм, в'ю і сервісів
    integration: наскрізні сценарії користувача (клієнт -> в'ю -> БД)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
