{% extends "catalog/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row align-items-center mb-4">
    <div class="col-lg-8">
        <h1 class="display-6">{{ title }}</h1>
        <p class="lead">{{ message }}</p>
    </div>
    <div class="col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 card-title">Швидкі дії</h2>
                <div class="d-grid gap-2">
                    <a class="btn btn-primary" href="{% url 'catalog:book_list' %}">Відкрити каталог</a>
                    {% if user.is_authenticated %}
                        <a class="btn btn-outline-primary" href="{% url 'catalog:book_create' %}">Додати книгу</a>
                    {% else %}
                        <a class="btn btn-outline-secondary" href="/admin/login/">Увійти, щоб додати книгу</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
