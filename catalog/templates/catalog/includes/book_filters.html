<form method="get" class="filter-panel border rounded p-3 mb-4">
    <div class="row g-3 align-items-end">
        <div class="col-md-4">
            <label for="filter-q" class="form-label">Пошук</label>
            <input type="search" name="q" id="filter-q" class="form-control"
                   value="{{ filter_q }}" placeholder="Назва або автор">
        </div>
        <div class="col-md-3">
            <label for="filter-category" class="form-label">Категорія</label>
            <select name="category" id="filter-category" class="form-select">
                <option value="">Усі категорії</option>
                {% for category in categories %}
                    <option value="{{ category.pk }}"
                            {% if filter_category == category.pk|stringformat:"s" %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" name="in_stock" value="1" id="filter-in-stock"
                       {% if filter_in_stock == "1" %}checked{% endif %}>
                <label class="form-check-label" for="filter-in-stock">Лише в наявності</label>
            </div>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100">Фільтр</button>
            <a href="{% if view_type == 'FBV' %}{% url 'catalog:book_list_fbv' %}{% else %}{% url 'catalog:book_list' %}{% endif %}"
               class="btn btn-outline-secondary">Скинути</a>
        </div>
    </div>
</form>
