{% extends "catalog/base.html" %}

{% block title %}Вхід через {{ provider.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h4 mb-3">Вхід через {{ provider.name }}</h1>
        <p class="text-muted">Вас буде перенаправлено на сайт провайдера.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Продовжити</button>
            <a href="{% url 'account_login' %}" class="btn btn-link">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
